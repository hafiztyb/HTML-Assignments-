<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to login form</title>
    <link rel="stylesheet" href="login-form.css">
</head>
<body>
    <a href="index-page.html"><img src="../Pics/back-icon.png" alt="Back-Button"></a>

        <img class="logo" src="../Pics/SMIT.jpg" alt="SMIT LOGO">

    <h1>STUDENT LOGIN FORM</h1>

    <form action=""></form>

            <button>Reset</button>
        </div>
